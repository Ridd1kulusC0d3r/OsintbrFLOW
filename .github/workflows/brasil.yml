name: Brasil CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brasil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-brasil.txt pytest pytest-asyncio
      - run: PYTHONPATH=flowsint-types/src:flowsint-core/src pytest tests/brasil/test_brasil.py tests/brasil/test_colab.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run typecheck:brasil --workspace flowsint-app
      - run: npm run build --workspace flowsint-app
      - run: npm run build:brasil --workspace flowsint-app
